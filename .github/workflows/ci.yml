name: Verify DSA Studio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:c
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/web
      - name: Start virtual audio output
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dsa_ci rate=48000 channels=2
          pactl set-default-sink dsa_ci
          pactl set-sink-mute dsa_ci 0
          pactl set-sink-volume dsa_ci 100%
          pactl info
          pactl list short sinks
      - run: npm run e2e
        env:
          PULSE_SINK: dsa_ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results/
